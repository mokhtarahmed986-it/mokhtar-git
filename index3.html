<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index3.css">
</head>

<body>
    <!-- start header -->
    <header id="header">
        <div class="sec1">
            <div class="title">
                <h1>CITROEN <br />&you</h1>
                <div class="child">

            </div>
            <h2>REPAIR ORDER</h2>

    </header>
    <!-- end header -->

    <section id="part-1">
        <div class="information-owner">
            <div class="info">

                    <label for="Name">Name</label>
                    <input type="text">
                </div>

                <div class="row">
                    <label for="adress">Adress</label>
                    <input type="text">

                <div class="row">
                    <span class="label-model"><label for="model year">Model year</label>

                </div>

                    <label for="Registration mn">Registration Mn</label>
                    <input type="text">
                </div>
                <div class="row-3">
                    <label for="Engine no">Engine NO</label>
                    <input type="text">
                </div>
                <div class="row-3">
                    <label for="VIN">VIN</label>
                    <input type="text">
                </div>

                <div class="row-3">
                    <label for="W.S.D">W.S.D</label>
                    <input type="text">
                </div>
            </div>

        </div>
